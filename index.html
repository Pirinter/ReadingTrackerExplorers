    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBRWKBjJco-lDMvUB0L_TALB2blwLBrtwc",
            authDomain: "readingtrackerexplorers.firebaseapp.com",
            projectId: "readingtrackerexplorers",
            storageBucket: "readingtrackerexplorers.firebasestorage.app",
            messagingSenderId: "351464628569",
            appId: "1:351464628569:web:1fdb9dfdae1d4fa7556c48"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'classbook_tracker_default';

        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'tracker_state');
        let isSyncing = false;

        // Helper to setup real-time listener
        function initFirestoreListener() {
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    let updated = false;
                    
                    if (data.students && Array.isArray(data.students) && data.students.length > 0) {
                        students = data.students;
                        updated = true;
                    }
                    if (data.recentLogs && Array.isArray(data.recentLogs)) {
                        recentLogs = data.recentLogs;
                        updated = true;
                    }
                    if (data.classroomLibrary && Array.isArray(data.classroomLibrary)) {
                        classroomLibrary = data.classroomLibrary;
                        updated = true;
                    }
                    
                    const logoUrl = data.customLogo || localStorage.getItem('classbook_custom_logo');
                    if (logoUrl) {
                        const img = document.getElementById('logo-img');
                        const svg = document.getElementById('logo-svg');
                        if (img && svg) {
                            img.src = logoUrl;
                            img.classList.remove('hidden');
                            svg.classList.add('hidden');
                        }
                    }
                    if (updated) {
                        renderAll();
                        console.log("Firebase sync: Data successfully loaded from cloud.");
                    }
                } else {
                    saveDataToFirebase();
                }
            }, (error) => {
                console.warn("Firestore listener note:", error.message);
            });
        }

        // Initialize Firestore directly without requiring Auth sign-in
        initFirestoreListener();
        console.log("Firebase Firestore connected successfully.");

        // Global save function synced to Firestore with persistence confirmation
        window.saveDataToFirebase = async function() {
            if (isSyncing) return;
            isSyncing = true;
            try {
                const customLogo = localStorage.getItem('classbook_custom_logo') || '';
                await setDoc(docRef, {
                    students,
                    recentLogs,
                    classroomLibrary,
                    customLogo,
                    updatedAt: new Date().toISOString()
                }, { merge: true });
                console.log("Firebase sync: Data successfully saved to cloud.");
            } catch (e) {
                console.error("Error saving to Firestore: ", e);
            } finally {
                isSyncing = false;
            }
        };
    </script>

        function loadCustomLogo(event) {
            if (!isAdmin) return;
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const imgObj = new Image();
                    imgObj.src = e.target.result;
                    imgObj.onload = function() {
                        // Resize image to ensure it fits mobile network and storage limits effortlessly (max 150x150)
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 150;
                        const MAX_HEIGHT = 150;
                        let width = imgObj.width;
                        let height = imgObj.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) {
                                height *= MAX_WIDTH / width;
                                width = MAX_WIDTH;
                            }
                        } else {
                            if (height > MAX_HEIGHT) {
                                width *= MAX_HEIGHT / height;
                                height = MAX_HEIGHT;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(imgObj, 0, 0, width, height);

                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);

                        const img = document.getElementById('logo-img');
                        const svg = document.getElementById('logo-svg');
                        img.src = compressedDataUrl;
                        img.classList.remove('hidden');
                        svg.classList.add('hidden');
                        
                        localStorage.setItem('classbook_custom_logo', compressedDataUrl);
                        if (window.saveDataToFirebase) window.saveDataToFirebase();
                        showAlert('Logo Updated!', 'Custom logo has been compressed and synced to all devices.');
                    };
                };
                reader.readAsDataURL(file);
            }
        }

        function handleBookSelectionChange(selectEl) {
            const customContainer = document.getElementById('custom-book-container');
            const pagesInput = document.getElementById('book-pages-input');

            if (selectEl.value === 'ADD_CUSTOM_BOOK') {
                customContainer.classList.remove('hidden');
                pagesInput.value = '100';
            } else {
                customContainer.classList.add('hidden');
                const selectedOption = selectEl.options[selectEl.selectedIndex];
                const pages = selectedOption.getAttribute('data-pages');
                if (pages) {
                    pagesInput.value = pages;

        function openStudentHistoryModal(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            const headerContainer = document.getElementById('history-modal-header');
            const avatarHtml = renderStudentAvatar(student, "w-12 h-12", "text-lg");
            headerContainer.innerHTML = `
                ${avatarHtml}
                <div>
                    <h3 class="font-bold text-slate-900 text-lg">${student.name}</h3>
                    <p class="text-xs text-slate-500">Level ${Math.floor((student.booksRead || 0) / 3) + 1} Reader</p>
                </div>
            `;

            const booksList = student.books || [];
            const totalPages = booksList.reduce((sum, b) => sum + (parseInt(b.pages) || 0), 0);

            const badgesContainer = document.getElementById('history-badges-container');
            badgesContainer.innerHTML = '';
            let badgesEarned = [];

            const booksCount = student.booksRead || 0;
            if (booksCount >= 1) badgesEarned.push({ name: 'First Chapter', icon: 'fa-book-open', color: 'bg-teal-100 text-teal-700 border-teal-200' });
            if (booksCount >= 3) badgesEarned.push({ name: 'Bookworm', icon: 'fa-worm', color: 'bg-indigo-100 text-indigo-700 border-indigo-200' });
            if (booksCount >= 5) badgesEarned.push({ name: '5-Book Star', icon: 'fa-star', color: 'bg-amber-100 text-amber-700 border-amber-200' });
            if (booksCount >= 10) badgesEarned.push({ name: '10-Book Club', icon: 'fa-trophy', color: 'bg-purple-100 text-purple-700 border-purple-200' });
            if (totalPages >= 100) badgesEarned.push({ name: '100+ Pages', icon: 'fa-file-lines', color: 'bg-blue-100 text-blue-700 border-blue-200' });
            if (totalPages >= 500) badgesEarned.push({ name: 'Page Master', icon: 'fa-fire', color: 'bg-rose-100 text-rose-700 border-rose-200' });

            if (badgesEarned.length === 0) {
                badgesContainer.innerHTML = `<span class="text-xs text-slate-400 italic">No badges earned yet. Keep reading!</span>`;
            } else {
                badgesEarned.forEach(b => {
                    badgesContainer.innerHTML += `
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-bold border ${b.color}">
                            <i class="fa-solid ${b.icon}"></i> ${b.name}
                        </span>
                    `;
                });
            }

            const historyBooksList = document.getElementById('history-books-list');
            historyBooksList.innerHTML = '';

            if (booksList.length === 0) {
                historyBooksList.innerHTML = `<p class="text-xs text-slate-400 text-center py-8">No books logged yet for this student.</p>`;
            } else {
                booksList.slice().reverse().forEach(book => {
                    const deleteBtn = isAdmin ? `<button onclick="deleteBookForStudent('${student.id}', '${book.id || ''}')" title="Delete Logged Book" class="text-slate-300 hover:text-rose-500 transition text-xs p-1 ml-2"><i class="fa-solid fa-trash"></i></button>` : '';
                    historyBooksList.innerHTML += `
                        <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-between text-xs">
                            <div class="truncate">
                                <span class="font-bold text-slate-800 block truncate">${book.title}</span>
                                <span class="text-[11px] text-slate-400"><i class="fa-solid fa-file-lines text-teal-600"></i> ${book.pages || 100} pages • Finished on ${book.date || 'Recent'}</span>
                            </div>
                            <div class="flex items-center shrink-0">
                                ${deleteBtn}
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('history-total-stats').innerText = `Total Books: ${booksCount} | Total Pages: ${totalPages}`;
            document.getElementById('modal-student-history').classList.remove('hidden');
        }

        function deleteBookForStudent(studentId, bookId) {
            if (!isAdmin) return;
            const student = students.find(s => s.id === studentId);
            if (!student || !student.books) return;

            student.books = student.books.filter(b => (b.id || '') !== bookId);
            student.booksRead = Math.max(0, (student.booksRead || 1) - 1);

            saveData();
            openStudentHistoryModal(studentId);
            renderAll();
            showAlert('Book Deleted', 'The book log has been removed from student history.');
        }

        function closeModals() {
            document.querySelectorAll('#modal-add-student, #modal-edit-student, #modal-log-book, #modal-admin-passcode, #modal-student-history').forEach(m => m.classList.add('hidden'));
        }

        function showAlert(title, message) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-message').innerText = message;
            document.getElementById('custom-alert').classList.remove('hidden');
        }

        function closeAlert() {
            document.getElementById('custom-alert').classList.add('hidden');
        }

        function handleAddStudent(e) {
            e.preventDefault();
            if (!isAdmin) return;
            const name = document.getElementById('student-name-input').value.trim();
            if (!name) return;

            const newStudent = {
                id: Date.now().toString(),
                name: name,
                color: selectedAvatarColor,
                icon: selectedAvatarIcon,
                avatarType: selectedAvatarType,
                avatarImage: selectedAvatarType === 'image' ? uploadedAvatarDataUrl : null,
                booksRead: 0,
                books: []
            };

            students.push(newStudent);
            saveData();
            closeModals();
            renderAll();
            showAlert('Student Added!', `${name} was added to the class reading tracker.`);
        }

        function handleEditStudent(e) {
            e.preventDefault();
            if (!isAdmin) return;

            const studentId = document.getElementById('edit-student-id').value;
            const name = document.getElementById('edit-student-name-input').value.trim();
            const student = students.find(s => s.id === studentId);

            if (!student || !name) return;

            student.name = name;
            student.avatarType = editAvatarType;
            student.color = editAvatarColor;
            student.icon = editAvatarIcon;
            if (editAvatarType === 'image' && editAvatarDataUrl) {
                student.avatarImage = editAvatarDataUrl;
            } else if (editAvatarType === 'icon') {
                student.avatarImage = null;
            }

            saveData();
            closeModals();
            renderAll();
            showAlert('Student Updated!', `${name}'s profile and avatar have been updated.`);
        }

        function handleLogBook(e) {
            e.preventDefault();
            if (!isAdmin) return;

            const studentId = document.getElementById('log-student-select').value;
            const dropdownVal = document.getElementById('log-book-dropdown').value;
            const pagesInput = parseInt(document.getElementById('book-pages-input').value) || 100;

            const student = students.find(s => s.id === studentId);
            if (!student) return;

            let finalBookTitle = dropdownVal;

            if (dropdownVal === 'ADD_CUSTOM_BOOK') {
                const customTitle = document.getElementById('custom-book-title-input').value.trim();
                if (!customTitle) {
                    showAlert('Title Required', 'Please enter a title for the new book.');
                    return;
                }
                finalBookTitle = customTitle;

                const exists = classroomLibrary.some(b => b.title.toLowerCase() === customTitle.toLowerCase());
                if (!exists) {
                    classroomLibrary.push({ title: customTitle, pages: pagesInput });
                }
            }

            student.booksRead = (student.booksRead || 0) + 1;
            if (!student.books) student.books = [];
            student.books.push({
                id: 'b_' + Date.now(),
                title: finalBookTitle,
                pages: pagesInput,
                date: new Date().toISOString().split('T')[0]
            });

            recentLogs.unshift({
                studentName: student.name,
                bookTitle: finalBookTitle,
                time: 'Just now'
            });
            if (recentLogs.length > 10) recentLogs.pop();

            saveData();
            closeModals();
            renderAll();
            showAlert('Book Logged!', `Recorded "${finalBookTitle}" for ${student.name}.`);
        }

        function deleteStudent(id) {
            if (!isAdmin) return;
            students = students.filter(s => s.id !== id);
            saveData();
            renderAll();
            showAlert('Student Removed', 'The student record has been deleted.');
        }

        function renderStudentAvatar(student, sizeClass = "w-9 h-9", textClass = "text-sm") {
            if (student.avatarType === 'image' && student.avatarImage) {
                return `<img src="${student.avatarImage}" class="${sizeClass} rounded-xl object-cover shrink-0 shadow-sm border border-slate-200" alt="${student.name}">`;
            }
            const icon = student.icon || 'fa-user';
            return `
                <div class="${sizeClass} rounded-xl flex items-center justify-center text-white ${textClass} shrink-0 shadow-sm" style="background-color: ${student.color || '#0d9488'}">
                    <i class="fa-solid ${icon}"></i>
                </div>
            `;
        }

        function renderAll() {
            document.getElementById('student-count').innerText = `${students.length} Students`;

            const sortedStudents = [...students].sort((a, b) => (b.booksRead || 0) - (a.booksRead || 0));

            // Render 3D Podium for Top 3
            const podiumContainer = document.getElementById('podium-container');
            podiumContainer.innerHTML = '';

            if (sortedStudents.length === 0) {
                podiumContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">No students available for podium.</p>`;
            } else {
                const top1 = sortedStudents[0];
                const top2 = sortedStudents[1];
                const top3 = sortedStudents[2];

                const renderPodiumSpot = (student, rank, heightClass, bgGradient, stepNum, crown = false) => {
                    if (!student) return `<div class="flex-1 max-w-[100px]"></div>`;
                    const avatarHtml = renderStudentAvatar(student, "w-12 h-12 sm:w-14 sm:h-14", "text-xl");
                    return `
                        <div class="flex flex-col items-center flex-1 max-w-[120px] transition-all transform hover:-translate-y-1 cursor-pointer" onclick="openStudentHistoryModal('${student.id}')">
                            <div class="relative mb-2 flex flex-col items-center">
                                ${crown ? '<div class="absolute -top-5 text-amber-400 text-lg animate-bounce"><i class="fa-solid fa-crown"></i></div>' : ''}
                                <div class="p-1 bg-slate-800 rounded-2xl shadow-lg border border-slate-700">
                                    ${avatarHtml}
                                </div>
                                <span class="font-bold text-xs sm:text-sm text-white mt-1 text-center truncate max-w-[100px] block">${(student.name || '').split(' ')[0]}</span>
                                <span class="bg-white/90 text-slate-900 text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow-md mt-0.5">${student.booksRead || 0} Books</span>
                            </div>
                            <div class="${heightClass} w-full ${bgGradient} rounded-t-2xl flex items-center justify-center border-t-2 border-x border-white/20 shadow-2xl relative">
                                <span class="text-3xl sm:text-4xl font-black text-white/40 select-none">${stepNum}</span>
                            </div>
                        </div>
                    `;
                };

                let podiumHtml = '';
                podiumHtml += renderPodiumSpot(top2, 2, 'h-28', 'bg-gradient-to-b from-indigo-500 to-indigo-700', '2');
                podiumHtml += renderPodiumSpot(top1, 1, 'h-36', 'bg-gradient-to-b from-indigo-400 to-indigo-600', '1', true);
                podiumHtml += renderPodiumSpot(top3, 3, 'h-20', 'bg-gradient-to-b from-indigo-600 to-indigo-800', '3');

                podiumContainer.innerHTML = podiumHtml;
            }

            // Render Leaderboard List
            const leaderboardList = document.getElementById('leaderboard-list');
            leaderboardList.innerHTML = '';

            if (sortedStudents.length === 0) {
                leaderboardList.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">No rankings available yet. Add students to display the leaderboard.</p>`;
            } else {
                sortedStudents.forEach((student, index) => {
                    const avatarHtml = renderStudentAvatar(student, "w-9 h-9 sm:w-10 sm:h-10", "text-sm");

                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-3 rounded-xl bg-slate-900/90 border border-slate-800/90 hover:border-indigo-500/50 transition shadow-sm w-full cursor-pointer';
                    row.onclick = () => openStudentHistoryModal(student.id);
                    row.innerHTML = `
                        <div class="flex items-center gap-3 truncate">
                            <span class="w-7 h-7 rounded-full bg-slate-800 text-slate-300 text-xs font-bold flex items-center justify-center border border-slate-700 shrink-0">
                                ${index + 1}
                            </span>
                            ${avatarHtml}
                            <div class="truncate">
                                <span class="font-bold text-sm text-slate-100 truncate block">${student.name}</span>
                                <span class="text-[11px] text-slate-400 flex items-center gap-1">
                                    <i class="fa-solid fa-book-open text-indigo-400 text-[10px]"></i> Completed ${student.booksRead || 0} ${(student.booksRead || 0) === 1 ? 'book' : 'books'}
                                </span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 bg-slate-800 px-3.5 py-1.5 rounded-full border border-slate-700 text-xs font-extrabold text-white shrink-0 shadow-inner">
                            <span class="text-slate-400 text-[10px] uppercase tracking-wider hidden sm:inline">Total:</span> ${student.booksRead || 0}
                        </div>
                    `;
                    leaderboardList.appendChild(row);
                });
            }

            // Render Students Grid
            const grid = document.getElementById('student-grid');
            grid.innerHTML = '';

            if (students.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-10 bg-white rounded-2xl border border-slate-100 text-slate-400">No students added yet. ${isAdmin ? 'Click "Add Student" to begin.' : ''}</div>`;
            } else {
                students.forEach(student => {
                    const card = document.createElement('div');
                    card.className = 'monster-card bg-white rounded-2xl p-5 shadow-sm border border-slate-100 flex flex-col justify-between relative overflow-hidden';
                    
                    const actionBtns = isAdmin ? `
                        <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                            <button onclick="openEditStudentModal('${student.id}')" title="Edit Student Profile & Photo" class="text-slate-400 hover:text-teal-600 transition text-sm p-1"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteStudent('${student.id}')" title="Delete Student" class="text-slate-300 hover:text-rose-500 transition text-sm p-1"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    ` : '';
                    const logBtn = isAdmin ? `<button onclick="event.stopPropagation(); openLogBookModal('${student.id}')" class="bg-teal-50 hover:bg-teal-100 text-teal-700 font-semibold text-xs px-3 py-1.5 rounded-xl transition flex items-center gap-1.5"><i class="fa-solid fa-plus"></i> Log Book</button>` : '';
                    const avatarHtml = renderStudentAvatar(student, "w-12 h-12", "text-lg");

                    card.onclick = () => openStudentHistoryModal(student.id);
                    card.style.cursor = 'pointer';

                    card.innerHTML = `
                        <div class="flex items-start justify-between">
                            <div class="flex items-center gap-3">
                                ${avatarHtml}
                                <div>
                                    <h4 class="font-bold text-slate-900">${student.name}</h4>
                                    <p class="text-xs text-slate-400 font-medium">${student.booksRead || 0} ${(student.booksRead || 0) === 1 ? 'Book' : 'Books'} Completed</p>
                                </div>
                            </div>
                            ${actionBtns}
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-xs font-semibold bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg">Level ${Math.floor((student.booksRead || 0) / 3) + 1} Reader</span>
                            ${logBtn}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }

            // Render Recent Activity
            const activityList = document.getElementById('recent-activity-list');
            activityList.innerHTML = '';

            if (recentLogs.length === 0) {
                activityList.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">No books logged yet. Start reading!</p>`;
            } else {
                recentLogs.forEach(log => {
                    const item = document.createElement('div');
                    item.className = 'p-2.5 rounded-xl bg-slate-50 border border-slate-100 flex items-center justify-between text-xs';
                    item.innerHTML = `
                        <div>
                            <span class="font-bold text-slate-800">${log.studentName}</span> finished <span class="font-medium text-teal-700">"${log.bookTitle}"</span>
                        </div>
                        <span class="text-slate-400 text-[10px]">${log.time}</span>
                    `;
                    activityList.appendChild(item);
                });
            }
        }

        window.onload = function() {
            updateRoleUI();
        };
    </script>
</body>
</html>
